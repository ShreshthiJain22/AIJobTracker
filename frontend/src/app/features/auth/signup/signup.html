<div class="auth-container">
    <div class="auth-card">
      <h1>Join Job Tracker 🌸</h1>
      <p class="subtitle">Create your account</p>
  
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" [(ngModel)]="email" name="email">
      </mat-form-field>
  
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword() ? 'password' : 'text'" [(ngModel)]="password" name="password">
        <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()">
          <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
      
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirm Password</mat-label>
        <input matInput [type]="hideConfirmPassword() ? 'password' : 'text'" [(ngModel)]="confirmPassword" name="confirmPassword">
        <button mat-icon-button matSuffix type="button" (click)="toggleConfirmPasswordVisibility()">
          <mat-icon>{{ hideConfirmPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
  
      <button mat-flat-button color="primary" class="full-width" (click)="onSignup()" [disabled]="loading()">
        <mat-spinner *ngIf="loading()" diameter="20" style="display: inline-block; margin-right: 8px;"></mat-spinner>
        <span *ngIf="!loading()">Sign Up</span>
        <span *ngIf="loading()">Creating account...</span>
      </button>
      <p class="switch-link">Already have an account? <a routerLink="/login">Log in</a></p>
    </div>
  </div>
