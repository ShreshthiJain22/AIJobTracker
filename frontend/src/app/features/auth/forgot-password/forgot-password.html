<div class="auth-container">
    <div class="auth-card">
      <div *ngIf="!submitted()">
        <h1>Forgot Password 🌸</h1>
        <p class="subtitle">Enter your email and we'll send you a reset link</p>
  
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" [(ngModel)]="email" name="email">
        </mat-form-field>
  
        <button mat-flat-button color="primary" class="full-width" (click)="onSubmit()" [disabled]="loading()">
          <mat-spinner *ngIf="loading()" diameter="20" style="display: inline-block; margin-right: 8px;"></mat-spinner>
          <span *ngIf="!loading()">Send Reset Link</span>
          <span *ngIf="loading()">Sending...</span>
        </button>
      </div>
  
      <div *ngIf="submitted()">
        <h1>Check Your Email</h1>
        <p class="subtitle">If an account exists with that email, we've sent a password reset link. It expires in 30 minutes.</p>
      </div>
  
      <p class="switch-link">Remembered your password? <a routerLink="/login">Log in</a></p>
    </div>
  </div>
