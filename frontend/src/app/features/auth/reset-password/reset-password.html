<div class="auth-container">
    <div class="auth-card">
      <div *ngIf="tokenMissing()">
        <h1>Invalid Link</h1>
        <p class="subtitle">This password reset link is missing or invalid.</p>
        <p class="switch-link"><a routerLink="/forgot-password">Request a new link</a></p>
      </div>
  
      <div *ngIf="!tokenMissing() && !success()">
        <h1>Set New Password 🌸</h1>
        <p class="subtitle">Choose a new password for your account</p>
  
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>New Password</mat-label>
          <input matInput type="password" [(ngModel)]="newPassword" name="newPassword">
        </mat-form-field>
  
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm Password</mat-label>
          <input matInput type="password" [(ngModel)]="confirmPassword" name="confirmPassword">
        </mat-form-field>
  
        <button mat-flat-button color="primary" class="full-width" (click)="onSubmit()" [disabled]="loading()">
          <mat-spinner *ngIf="loading()" diameter="20" style="display: inline-block; margin-right: 8px;"></mat-spinner>
          <span *ngIf="!loading()">Reset Password</span>
          <span *ngIf="loading()">Resetting...</span>
        </button>
      </div>
  
      <div *ngIf="success()">
        <h1>Password Reset</h1>
        <p class="subtitle">Your password has been changed successfully.</p>
        <button mat-flat-button color="primary" class="full-width" routerLink="/login">Go to Login</button>
      </div>
    </div>
  </div>
